name: uhnify

on:
  push:
    branches:
      - main
  # Catch it on the branch, before it reaches main. Every failure in this
  # workflow's history landed on main because there was nothing checking
  # earlier.
  pull_request:

defaults:
  run:
    working-directory: ./app

jobs:
  build:

    runs-on: ubuntu-latest
    # A Meteor build plus the suite takes a few minutes; past this it is a hang,
    # and a hung job holds a runner until GitHub's own six-hour ceiling.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3

      - name: Cache node modules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-v5-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

      - uses: actions/setup-node@v3
        with:
          node-version: '16.x'

      - run: npm ci --legacy-peer-deps

      - run: curl https://install.meteor.com/ | sh

      - name: Install Meteor packages
        shell: bash -l {0}
        run: meteor npm install

      # Split from the tests deliberately. Run as one block, a red build said
      # something was wrong without saying whether the code was badly formatted
      # or actually broken — and those deserve different reactions.
      - name: Lint
        shell: bash -l {0}
        run: meteor npm run lint

      # The server suite: methods, publications, cascades, the audit trail and
      # the authorization cases — including the profile-takeover regression,
      # which is the single test most worth a build catching.
      #
      # Not simply `meteor npm test`, and the reason is load-bearing. That
      # command runs every test, prints the summary in about six seconds, then
      # waits for a browser to run the CLIENT half — which a runner does not
      # have. The first attempt at this step passed all 43 and then sat for
      # fifteen minutes until the job timeout killed it. `TEST_CLIENT=0` and
      # `TEST_CLIENT=false` both hang identically; neither is a fix.
      #
      # There are no client tests to wait for: every *.tests.js file in this
      # repo is wrapped in `if (Meteor.isServer)`. So rather than download a
      # browser to discover that, the run is stopped once it has printed its
      # summary and judged on what it printed.
      #
      # That is a workaround, and it is written as one. What makes it safe is
      # that it fails closed: a failing test exits 1, and so does a run that
      # printed no summary at all — verified both ways before this was
      # committed, by breaking a test on purpose and watching it go red.
      - name: Server tests
        shell: bash -l {0}
        run: |
          rm -f test.log
          meteor npm test > test.log 2>&1 &
          RUNNER=$!
          for _ in $(seq 1 150); do
            grep -qE "[0-9]+ (passing|failing)" test.log && break
            kill -0 $RUNNER 2>/dev/null || break
            sleep 2
          done
          sleep 2
          kill $RUNNER 2>/dev/null || true
          sed 's/I[0-9]*-[0-9:.()+-]*? *//' test.log | tail -40
          if grep -qE "[1-9][0-9]* failing" test.log; then
            echo "::error::server tests failed"
            exit 1
          fi
          if ! grep -qE "[0-9]+ passing" test.log; then
            echo "::error::server tests produced no result — the run did not get that far"
            exit 1
          fi

#      - name: End-to-end
#        shell: bash -l {0}
