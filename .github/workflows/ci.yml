name: uhnify

on:
  push:
    branches:
      - main
  # Catch it on the branch, before it reaches main. Every failure in this
  # workflow's history landed on main because there was nothing checking
  # earlier.
  pull_request:

defaults:
  run:
    working-directory: ./app

jobs:
  build:

    runs-on: ubuntu-latest
    # A Meteor build plus the suite takes a few minutes; past this it is a hang,
    # and a hung job holds a runner until GitHub's own six-hour ceiling.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3

      - name: Cache node modules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-v5-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

      - uses: actions/setup-node@v3
        with:
          node-version: '16.x'

      - run: npm ci --legacy-peer-deps

      - run: curl https://install.meteor.com/ | sh

      - name: Install Meteor packages
        shell: bash -l {0}
        run: meteor npm install

      # Split from the tests deliberately. Run as one block, a red build said
      # something was wrong without saying whether the code was badly formatted
      # or actually broken — and those deserve different reactions.
      - name: Lint
        shell: bash -l {0}
        run: meteor npm run lint

      # The 43 server tests are NOT wired in here yet, and the reason is worth
      # writing down so the next attempt does not repeat it.
      #
      # `meteor npm test` runs them, passes all 43 in about six seconds, prints
      # "Load the app in a browser to run client tests" — and then waits for a
      # browser that never arrives. On a runner that is a job hanging until the
      # timeout below kills it, with every test green in the log above. It exits
      # on this machine and does not exit on CI, so a local check of the exit
      # code is not evidence about what the runner will do.
      #
      # The fix is to give meteortesting:mocha a browser driver (TEST_BROWSER_
      # DRIVER=puppeteer, plus the dependency) so the client half actually runs
      # and the process can finish. That is a real change with a real download
      # cost, not a flag, so it is left for its own commit rather than bolted on
      # here. `TEST_CLIENT=0` does NOT work — it hangs in exactly the same way.
      #
      #  - name: Server tests
      #    shell: bash -l {0}
      #    run: meteor npm test

#      - name: End-to-end
#        shell: bash -l {0}
#        run: meteor npm run testcafe-ci
